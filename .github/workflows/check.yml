name: Checks
on: [push, pull_request]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: ./windows/build.ps1
      - run: dotnet run --project windows/tests/CareCare.PolicyTests.csproj
      - run: ./windows/tests/BrowserPolicy.Tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CareCare-Windows-service-x64
          path: windows/publish/

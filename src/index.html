<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Allowed websites · CareCare.lol</title>
    <link rel="stylesheet" href="styles.css">
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="#" aria-label="CareCare.lol">CareCare<span>.lol</span></a>
        <span class="local-label">Stored locally</span>
      </header>

      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">Website access</p>
        <h1 id="page-title">Allowed websites</h1>
        <p class="introduction">Choose the websites that can be opened on protected devices. Add a domain, review the list, then save your changes.</p>

        <form id="website-form">
          <label for="website-input">Website address</label>
          <div class="input-row">
            <input id="website-input" type="text" inputmode="url" autocomplete="url" placeholder="example.com" maxlength="2048" required>
            <button class="add-button" type="submit">Add website</button>
          </div>
          <p class="hint">Use a domain or full website address.</p>
        </form>

        <div class="list-heading">
          <h2>Your list</h2>
          <span id="website-count">0 websites</span>
        </div>
        <div class="list-panel">
          <p id="empty-state" class="empty-state">No websites added yet.</p>
          <ul id="website-list" aria-live="polite"></ul>
        </div>

        <footer>
          <span id="save-status" role="status">Loading…</span>
          <button id="save-button" class="save-button" type="button">Save allowed websites</button>
        </footer>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Allowed websites · CareCare.lol</title>
    <link rel="stylesheet" href="styles.css">
    <script src="renderer.js" type="module"></script>
  </head>
  <body>
    <main>
      <section class="content" aria-labelledby="page-title">
        <h1 id="page-title">Allowed websites</h1>

        <form id="website-form">
          <label for="website-input">Website address</label>
          <div class="input-row">
            <input id="website-input" type="text" inputmode="url" autocomplete="url" placeholder="example.com" maxlength="2048" required>
            <button class="add-button" type="submit">Add website</button>
          </div>
          <div class="subdomain-option">
            <div class="subdomain-copy">
              <label for="allow-subdomains">
                Allow subdomains
                <span class="info-tooltip" tabindex="0" aria-label="Also allow addresses such as www.example.com and video.example.com.">
                  <span aria-hidden="true">i</span>
                  <span class="tooltip-text" role="tooltip">Also allow addresses such as www.example.com and video.example.com.</span>
                </span>
              </label>
            </div>
            <label class="switch" aria-label="Allow subdomains">
              <input id="allow-subdomains" type="checkbox">
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </div>
        </form>

        <div class="list-heading">
          <h2>Your list</h2>
          <span id="website-count">0 websites</span>
        </div>
        <div class="list-panel">
          <p id="empty-state" class="empty-state">No websites added yet.</p>
          <ul id="website-list" aria-live="polite"></ul>
        </div>

        <footer>
          <span id="save-status" role="status">Loading…</span>
          <button id="save-button" class="save-button" type="button">Retry applying list</button>
        </footer>
      </section>
    </main>
  </body>
</html>
